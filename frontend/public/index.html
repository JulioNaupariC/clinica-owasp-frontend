<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      ISO/IEC 27001:2022 — A.8.25 Uso de la criptografía / A.8.26 Seguridad de
      aplicaciones informáticas.
      Content-Security-Policy declarativa estricta (sin 'unsafe-inline' ni
      'unsafe-eval') respaldada por Subresource Integrity (SRI) en CDNs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://jsdelivr.net;
        style-src 'self' https://jsdelivr.net https://googleapis.com;
        font-src 'self' https://gstatic.com data:;
        img-src 'self' data:;
        connect-src 'self' http://localhost:8000;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
      "
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Clínica — Sistema de Gestión OWASP</title>

    <link
      href="https://jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
      integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </body>
</html>
